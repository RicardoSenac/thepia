<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para você ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffc0cb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-container {
            position: relative;
            width: 500px;
            max-width: 90vw;
        }

        svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        /* CONTORNO DO CORAÇÃO */

        #heart {
            fill: #ff0000;
            stroke: #ff0000;
            stroke-width: 3;

            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;

            animation: drawHeart 5s linear forwards;
        }

        @keyframes drawHeart {
            to {
                stroke-dashoffset: 0;
            }
        }


        /* SETINHA BRANCA */

        #arrow {
            fill: white;

            opacity: 1;
        }


        /* BOTÃO */

       #musicButton {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%) scale(0.5);

    padding: 15px 30px;

    border: none;
    border-radius: 50px;

    background: white;
    color: #ff0000;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    opacity: 0;

    transition: all 0.5s ease;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

    z-index: 10;
}

#musicButton.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

#musicButton:hover {
    transform: translate(-50%, -50%) scale(1.08);
}


        /* =========================
           FOTOS NOS QUATRO CANTOS
           ========================= */

        .photos {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: 5;
        }

        .photo {
            position: absolute;

            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 15px;

            border: 4px solid white;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }


        /* FOTO SUPERIOR ESQUERDA */

        .photo1 {
            top: 160px;
            left: 160px;

            transform: rotate(-7deg);
        }


        /* FOTO SUPERIOR DIREITA */

        .photo2 {
            top: 160px;
            right: 160px;

            transform: rotate(7deg);
        }


        /* FOTO INFERIOR ESQUERDA */

        .photo3 {
            bottom: 160px;
            left: 160px;

            transform: rotate(7deg);
        }


        /* FOTO INFERIOR DIREITA */

        .photo4 {
            bottom: 160px;
            right: 160px;

            transform: rotate(-7deg);
        }


        /* CELULAR */

        @media (max-width: 600px) {

            .photo {
                width: 80px;
                height: 80px;

                border-width: 3px;
            }

            .photo1 {
                top: 80px;
                left: 80px;
            }

            .photo2 {
                top: 80px;
                right: 80px;
            }

            .photo3 {
                bottom: 80px;
                left: 80px;
            }

            .photo4 {
                bottom: 80px;
                right: 80px;
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <div class="heart-container">

            <svg viewBox="0 0 500 430">

                <!-- CAMINHO DO CORAÇÃO -->

                <path
                    id="heart"
                    d="
                    M250 380
                    C170 310 90 250 90 160
                    C90 70 200 45 250 130
                    C300 45 410 70 410 160
                    C410 250 330 310 250 380
                    Z
                    "
                />


                <!-- SETA QUE ACOMPANHA O CORAÇÃO -->

                <polygon
                    id="arrow"
                    points="-10,-10 15,0 -10,10 -4,0"
                >

                    <animateMotion
                        dur="5s"
                        begin="0s"
                        fill="freeze"
                        rotate="auto"
                    >

                        <mpath href="#heart" />

                    </animateMotion>

                </polygon>


            </svg>


            <!-- BOTÃO -->

            <button
                id="musicButton"
                onclick="window.location.href='certo.html'"
            >
                💗 me ama: clica
                gosta do 😈: só olha 💗
            </button>
<div class="photos">
    <img src="fotinha1.jpeg" class="photo photo1">
    <img src="fotinha 2.jpeg" class="photo photo2">
    <img src="fotinha 3.jpeg" class="photo photo3">
    <img src="fotinha 4.jpeg" class="photo photo4">

</div>



    <script>

        setTimeout(function () {

            document
                .getElementById("musicButton")
                .classList.add("show");

        }, 5200);

    </script>

</body>

</html>
